name: Dependabot auto-merge minor/patch
on: workflow_call

permissions:
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot patch or minor version bumps
        if: ${{steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'}}
        run: |
          gh label create AutoMerged -c '#B60205' -d 'PR was automatically merged by an action.' --repo $GITHUB_REPOSITORY 2>/dev/null || true
          gh pr edit --add-label "AutoMerged" "$PR_URL"
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          # Merges made with GITHUB_TOKEN don't trigger other workflows (e.g.
          # push-to-master builds), so prefer a real token where one exists.
          # Must be a *Dependabot* secret (Dependabot-triggered runs can't see
          # Actions secrets) and the caller must use `secrets: inherit`.
          GITHUB_TOKEN: ${{secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN}}
